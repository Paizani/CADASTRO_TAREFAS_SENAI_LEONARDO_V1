<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Painel de Tarefas</title>

    <!-- Estilos principais da aplicação -->
    <link rel="stylesheet" href="style.css">

    
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <!-- Container principal que encapsula todo o cartão do aplicativo -->
    <main class="cartao-aplicacao">

        <!-- Cabeçalho: foto do perfil, título e botões de ação rápida -->
        <header class="cabecalho-aplicacao">

            <div class="perfil">
                <img
                    src="paizani.jpg"
                    alt="Minha foto"
                    class="foto-perfil"
                >

                <div>
                    <h1>
                        Minhas Tarefas
                        <span class="estrela">✨</span>
                    </h1>

                    <p class="subtitulo">
                        Organize seu dia de forma simples e descomplicada
                    </p>
                </div>
            </div>

            <div class="acoes-cabecalho">

                <!-- Botão para recarregar/re-renderizar a lista -->
                <button
                    id="botao-atualizar"
                    class="botao-icone"
                    type="button"
                    title="Atualizar"
                >
                    <i class="fa-solid fa-rotate"></i>
                </button>

                <!-- Botão para alternar entre Modo Claro e Escuro -->
                <button
                    id="botao-tema"
                    class="botao-icone"
                    type="button"
                    title="Modo escuro"
                >
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </header>

        <!-- Formulário para digitação e adição da nova tarefa -->
        <section class="caixa-entrada">

            <input
                type="text"
                id="campo-tarefa"
                placeholder="O que vamos fazer hoje?"
                maxlength="80"
            >

            <button
                id="botao-adicionar"
                class="botao-principal"
                type="button"
            >
                <i class="fa-solid fa-plus"></i>
                Adicionar
            </button>

        </section>

        <!-- Configurações da tarefa: Prioridade, Data limite e Criterio de Ordenação -->
        <section class="opcoes-tarefa">

            <div class="campo-opcao">
                <label for="prioridade">
                    Prioridade
                </label>

                <select id="prioridade">
                    <option value="normal">Normal</option>
                    <option value="alta">Alta</option>
                    <option value="urgente">Urgente</option>
                </select>
            </div>

            <div class="campo-opcao">
                <label for="data-tarefa">
                    Data
                </label>

                <input
                    type="date"
                    id="data-tarefa"
                >
            </div>

            <div class="campo-opcao">
                <label for="select-ordenacao">
                    Ordenar por
                </label>

                <select id="select-ordenacao">
                    <option value="data">Data de Vencimento</option>
                    <option value="urgencia">Urgência / Prioridade</option>
                    <option value="padrao">Mais Recentes</option>
                </select>
            </div>

        </section>

        <!-- Campo de busca em tempo real -->
        <section class="pesquisa">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="campo-pesquisa"
                placeholder="Pesquisar tarefas..."
            >

        </section>

        <!-- Painel de Métricas/Estatísticas dinâmicas -->
        <section class="estatisticas">

            <div class="estatistica">
                <strong id="total-tarefas">0</strong>
                <span>Total</span>
            </div>

            <div class="estatistica">
                <strong id="total-pendentes">0</strong>
                <span>Pendentes</span>
            </div>

            <div class="estatistica">
                <strong id="total-concluidas">0</strong>
                <span>Concluídas</span>
            </div>

            <div class="estatistica">
                <strong id="total-favoritas">0</strong>
                <span>Favoritas</span>
            </div>

        </section>

        <!-- Abas para filtragem por status das tarefas -->
        <nav class="filtros">

            <button
                class="filtro ativo"
                data-filtro="todas"
                type="button"
            >
                Todas
            </button>

            <button
                class="filtro"
                data-filtro="pendentes"
                type="button"
            >
                Pendentes
            </button>

            <button
                class="filtro"
                data-filtro="concluidas"
                type="button"
            >
                Concluídas
            </button>

            <button
                class="filtro"
                data-filtro="favoritas"
                type="button"
            >
                Favoritas
            </button>

            <button
                class="filtro"
                data-filtro="fixadas"
                type="button"
            >
                Fixadas
            </button>

        </nav>

        <!-- Elemento HTML retornado pelo JS com as tarefas criadas -->
        <ul
            id="lista-tarefas"
            class="lista-tarefas"
        ></ul>

        <!-- Mensagem amigável de estado vazio -->
        <div
            id="mensagem-vazia"
            class="mensagem-vazia"
        >
            <i class="fa-solid fa-clipboard-check"></i>

            <strong>Nenhuma tarefa encontrada</strong>

            <span>
                Adicione uma tarefa para começar.
            </span>
        </div>

        <!-- Rodapé do cartão com resumo e ação em lote -->
        <footer class="rodape-aplicacao">

            <span id="contador-tarefas">
                0 tarefas
            </span>

            <button
                id="botao-limpar"
                class="botao-limpar"
                type="button"
            >
                <i class="fa-solid fa-broom"></i>
                Limpar concluídas
            </button>

        </footer>

    </main>

    <!-- Vinculação do arquivo de script JS -->
    <script src="script.js"></script>

</body>

</html>
