<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
    <div class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">
            <h1>Minhas Tarefas ✨</h1>
            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-plus"></i>Adicionar </button>
        </div>
        <ul id="listra-tarefas" class="listra-tarefas">
            <!-- As tarefas serão inseridas aqui dinamicamente via JS -->
        </ul>
        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
